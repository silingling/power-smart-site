server:
  port: 8080
  shutdown: graceful                    # 优雅关闭

spring:
  application:
    name: power-smart-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      # ---------- 全局默认过滤器 ----------
      default-filters:
        # 限流：默认每秒 100 请求，突发 200
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@remoteAddrKeyResolver}"

      # ---------- 全局 CORS ----------
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # ========== 同业电力前端适配路由 ==========

        # 登录/登出
        - id: login
          uri: lb://power-smart-system
          predicates: [Path=/login,/logout]
          filters: [StripPrefix=0]

        # 人员模块
        - id: labour-team
          uri: lb://power-smart-worker
          predicates: [Path=/build/labourTeam/**]
          filters: [StripPrefix=0]

        - id: labour-subcontractor
          uri: lb://power-smart-worker
          predicates: [Path=/build/labourSubcontractor/**]
          filters: [StripPrefix=0]

        - id: labour-worktype
          uri: lb://power-smart-worker
          predicates: [Path=/build/labourWorktype/**]
          filters: [StripPrefix=0]

        - id: labour-advance-retreat
          uri: lb://power-smart-worker
          predicates: [Path=/build/labourAdvanceRetreat/**]
          filters: [StripPrefix=0]

        - id: labour-construction-unit
          uri: lb://power-smart-worker
          predicates: [Path=/build/labourConstructionUnit/**]
          filters: [StripPrefix=0]

        - id: labour-infocollection
          uri: lb://power-smart-worker
          predicates: [Path=/build/labourInfocollection/**]
          filters: [StripPrefix=0]

        # 视频/监控
        - id: video-monitor
          uri: lb://power-smart-device
          predicates: [Path=/build/videoMonitor/**,/build/ysy/**]
          filters: [StripPrefix=0]

        - id: equipment-location
          uri: lb://power-smart-device
          predicates: [Path=/build/equipmentLocation/**]
          filters: [StripPrefix=0]

        - id: equipment-assets
          uri: lb://power-smart-device
          predicates: [Path=/build/equipmentAssets/**]
          filters: [StripPrefix=0]

        # 安全/隐患
        - id: safety-material
          uri: lb://power-smart-hazard
          predicates: [Path=/build/safetyMaterial/**]
          filters: [StripPrefix=0]

        # 隐患上报 + 工单
        - id: hazard-report
          uri: lb://power-smart-hazard
          predicates: [Path=/build/hazardReport/**]
          filters: [StripPrefix=0]

        - id: hazard-work-order
          uri: lb://power-smart-hazard
          predicates: [Path=/build/hazardWorkOrder/**]
          filters: [StripPrefix=0]

        # 文件上传/预览
        - id: file-upload
          uri: lb://power-smart-hazard
          predicates: [Path=/build/ApiFile/**]
          filters: [StripPrefix=0]

        # 质量
        - id: qual-material
          uri: lb://power-smart-hazard
          predicates: [Path=/build/qualMaterial/**]
          filters: [StripPrefix=0]

        - id: qual-material-catalog
          uri: lb://power-smart-hazard
          predicates: [Path=/build/qualMaterialCatalog/**]
          filters: [StripPrefix=0]

        - id: qual-material-changelog
          uri: lb://power-smart-hazard
          predicates: [Path=/build/qualMaterialChangelog/**]
          filters: [StripPrefix=0]

        - id: safety-material-catalog
          uri: lb://power-smart-hazard
          predicates: [Path=/build/safetyMaterialCatalog/**]
          filters: [StripPrefix=0]

        - id: safety-material-changelog
          uri: lb://power-smart-hazard
          predicates: [Path=/build/safetyMaterialChangelog/**]
          filters: [StripPrefix=0]

        # 特种作业票
        - id: special-work-permit
          uri: lb://power-smart-hazard
          predicates: [Path=/build/specialWorkPermit/**]

        # AI摄像头管理
        - id: ai-camera
          uri: lb://power-smart-hazard
          predicates: [Path=/build/aiCamera/**]
          filters: [StripPrefix=0]
        - id: ai-snapshot
          uri: lb://power-smart-hazard
          predicates: [Path=/build/aiSnapshot/**]
          filters: [StripPrefix=0]
        - id: ai-detection-callback
          uri: lb://power-smart-hazard
          predicates: [Path=/build/aiDetectionCallback/**]
          filters: [StripPrefix=0]

        # 报表导出
        - id: report-export
          uri: lb://power-smart-system
          predicates: [Path=/build/reportExport/**]
          filters: [StripPrefix=0]
        - id: report-template
          uri: lb://power-smart-system
          predicates: [Path=/build/reportTemplate/**]
          filters: [StripPrefix=0]

        # 审计日志
        - id: operate-log
          uri: lb://power-smart-system
          predicates: [Path=/build/operateLog/**]
          filters: [StripPrefix=0]
          filters: [StripPrefix=0]

        # 项目信息
        - id: project-info
          uri: lb://power-smart-system
          predicates: [Path=/build/projectInfo/**,/build/singleBuildingInfo/**,/build/projectUser/**]
          filters: [StripPrefix=0]

        - id: project-eval
          uri: lb://power-smart-system
          predicates: [Path=/build/evalLevel/**]
          filters: [StripPrefix=0]

        # 进度
        - id: progress
          uri: lb://power-smart-progress
          predicates: [Path=/work/work/**,/build/progressPlanManageDetails/**]
          filters: [StripPrefix=0]

        # 系统管理
        - id: admin-user
          uri: lb://power-smart-system
          predicates: [Path=/adminUser/**,/adminCommon/**,/adminDept/**]
          filters: [StripPrefix=0]

        - id: admin-other
          uri: lb://power-smart-system
          predicates: [Path=/adminConfig/**,/adminSupplyPoint/**]
          filters: [StripPrefix=0]

        # 监控点告警 + 环境数据
        - id: monitor-alert
          uri: lb://power-smart-device
          predicates: [Path=/build/monitorPointAlert/**,/build/eqMonitorDataAt/**]
          filters: [StripPrefix=0]

        # 告警规则管理
        - id: alert-rule
          uri: lb://power-smart-device
          predicates: [Path=/build/alertRule/**]
          filters: [StripPrefix=0]

        # 通知管理
        - id: notification
          uri: lb://power-smart-device
          predicates: [Path=/build/notification/**]
          filters: [StripPrefix=0]

        # SSE 实时推送
        - id: sse-subscribe
          uri: lb://power-smart-device
          predicates: [Path=/api/v1/sse/**]

        # 变电站设备台账
        - id: substation-equipment
          uri: lb://power-smart-device
          predicates: [Path=/build/substationEquipment/**]
          filters: [StripPrefix=0]

        # 变电站巡检
        - id: substation-inspection
          uri: lb://power-smart-device
          predicates: [Path=/build/substationInspection/**]
          filters: [StripPrefix=0]

        # 输电线路杆塔
        - id: transmission-tower
          uri: lb://power-smart-device
          predicates: [Path=/build/transmissionTower/**]
          filters: [StripPrefix=0]

        # 输电线路档距
        - id: transmission-span
          uri: lb://power-smart-device
          predicates: [Path=/build/transmissionSpan/**]
          filters: [StripPrefix=0]

        # 安全围栏
        - id: safety-fence
          uri: lb://power-smart-device
          predicates: [Path=/build/safetyFence/**]
          filters: [StripPrefix=0]

        - id: fence-alert-event
          uri: lb://power-smart-device
          predicates: [Path=/build/fenceAlertEvent/**]
          filters: [StripPrefix=0]

        # 看板
        - id: dashboard
          uri: lb://power-smart-dashboard
          predicates: [Path=/build/dashboard/**]
          filters: [StripPrefix=0]

        # 文件导出
        - id: excel-export
          uri: lb://power-smart-system
          predicates: [Path=/build/excelImpModelExport/**,/build/ApiFile/**]
          filters: [StripPrefix=0]

        # 考勤导入
        - id: attendance-import
          uri: lb://power-smart-worker
          predicates: [Path=/build/bLabourAttendanceRecord/**]
          filters: [StripPrefix=0]

        # 系统菜单/角色
        - id: admin-menu-role
          uri: lb://power-smart-system
          predicates: [Path=/adminMenu/**,/adminRole/**]
          filters: [StripPrefix=0]

        # PMS数据同步
        - id: pms-sync
          uri: lb://power-smart-system
          predicates: [Path=/build/pmsSync/**]
          filters: [StripPrefix=0]

        # ========== 内部 REST API（兼容） ==========
        - id: worker-internal
          uri: lb://power-smart-worker
          predicates: [Path=/api/v1/workers/**,/api/v1/teams/**]

        - id: device-internal
          uri: lb://power-smart-device
          predicates: [Path=/api/v1/devices/**]

        - id: hazard-internal
          uri: lb://power-smart-hazard
          predicates: [Path=/api/v1/hazards/**]

        - id: progress-internal
          uri: lb://power-smart-progress
          predicates: [Path=/api/v1/progress/**]

        - id: system-internal
          uri: lb://power-smart-system
          predicates: [Path=/api/v1/users/**,/api/v1/projects/**,/api/v1/system/**]

        - id: dashboard-internal
          uri: lb://power-smart-dashboard
          predicates: [Path=/api/v1/dashboard/**]

    discovery:
      locator:
        enabled: true

  main:
    web-application-type: reactive

spring.cloud.nacos.discovery:
  server-addr: ${NACOS_HOST:127.0.0.1}:8848
  namespace: ${NACOS_NAMESPACE:public}

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

# ---------- 日志 ----------
logging:
  level:
    com.powersmart.gateway: debug
    org.springframework.cloud.gateway: info
